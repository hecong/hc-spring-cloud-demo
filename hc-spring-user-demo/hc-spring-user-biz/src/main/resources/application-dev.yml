spring:
  cloud:
    nacos:
      server-addr: 192.168.218.75:8848
      # Nacos 配置中心
      config:
        server-addr: ${spring.cloud.nacos.server-addr}
        namespace: scm_dev
        group: DEFAULT_GROUP
        username: base_cloud
        password: base_cloud
        file-extension: yaml
        refresh-enabled: true
      # Nacos 服务发现
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
        namespace: scm_dev
        group: DEFAULT_GROUP
        username: base_cloud
        password: base_cloud
  # 通过 spring.config.import 导入 Nacos 配置（含共享配置）
  config:
    import:
      - nacos:hc-user-service.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:hc-redis.yaml?group=DEFAULT_GROUP&refreshEnabled=true
hc:
  satoken:
    login:
      login-paths:
        - /auth/**
        - /cuser/register
        - /cuser/reset-password
    exclude-paths:
      - /doc.html
      - /v3/api-docs/**
      - /webjars/**
      - /swagger-resources/**
      - /favicon.ico
    frontend:
      cors-allowed-origins: "http://localhost:3000,http://127.0.0.1,https://app.apifox.com"
